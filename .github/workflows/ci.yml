name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The inherited pytest suite asserts font artifacts produced by a separate
      # font-build pipeline. This repository publishes static SVG bundles only;
      # bundle-check.yml performs its functional Unicode/asset validation.
      - name: Check bundle-builder syntax
        run: |
          python -m py_compile scripts/build_bundle.py scripts/bundle_artifacts.py scripts/verify_bundle.py scripts/package_bundle.py scripts/package_npm.py
          python -m unittest tests/test_package_npm.py
