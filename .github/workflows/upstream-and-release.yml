name: Upstream sync and release bundle

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and merge upstream
        id: upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/tpnonthealps/blob-emoji.git 2>/dev/null || git remote set-url upstream https://github.com/tpnonthealps/blob-emoji.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-commit --no-ff upstream/main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Create upstream update pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-sync
          delete-branch: true
          title: 'chore: sync tpnonthealps/blob-emoji upstream'
          commit-message: 'chore: sync tpnonthealps/blob-emoji upstream'
          body: |
            Automated weekly sync from https://github.com/tpnonthealps/blob-emoji.

            The pull-request checks build the static release bundle and publish explicit Emoji 17 coverage metadata as an artifact.

  build-bundle:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned bundle dependencies
        run: pip install --requirement requirements-bundle.txt
      - name: Build and validate Unicode Emoji 17 bundle
        run: |
          python scripts/build_bundle.py --output dist/blob-emoji
          python scripts/verify_bundle.py dist/blob-emoji
          python scripts/package_npm.py dist/blob-emoji dist/npm/blob-emoji dist/npm/blob-emoji.tgz
      - name: Upload bundle and coverage metadata
        uses: actions/upload-artifact@v4
        with:
          name: blob-emoji-bundle
          path: dist/blob-emoji
          if-no-files-found: error
      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: blob-emoji-npm-package
          path: |
            dist/npm/blob-emoji
            dist/npm/blob-emoji.tgz
          if-no-files-found: error
      - name: Package release archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/package_bundle.py dist/blob-emoji blob-emoji-${{ github.sha }}.tar.gz
          python scripts/verify_bundle.py dist/blob-emoji --archive blob-emoji-${{ github.sha }}.tar.gz
      - name: Publish immutable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bundle-${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" "blob-emoji-${{ github.sha }}.tar.gz" "blob-emoji-${{ github.sha }}.tar.gz.sha256" "dist/npm/blob-emoji.tgz" --target "${{ github.sha }}" --title "Blob Emoji bundle $TAG" --notes "Self-contained SVG, picker, text-recognition, atlas, and npm package artifacts generated from this immutable source commit. See manifest.json and checksums.sha256 in the archives."
      - uses: actions/setup-node@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish immutable public npm package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dist/npm/blob-emoji/package.json"))["version"])')
          if npm view "@0230am/blob-emoji@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then exit 0; fi
          npm publish dist/npm/blob-emoji.tgz --access public --tag latest --provenance
      - name: Verify anonymous pnpm installation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dist/npm/blob-emoji/package.json"))["version"])')
          npm install --global pnpm@10
          mkdir "$RUNNER_TEMP/blob-emoji-install-check"
          cd "$RUNNER_TEMP/blob-emoji-install-check"
          printf '{"private":true}\n' > package.json
          for ATTEMPT in 1 2 3 4 5; do
            if env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/dev/null pnpm add "@0230am/blob-emoji@$VERSION" --registry https://registry.npmjs.org/; then break; fi
            if [ "$ATTEMPT" = 5 ]; then exit 1; fi
            sleep 10
          done
          python "$GITHUB_WORKSPACE/scripts/package_npm.py" --verify-only "$GITHUB_WORKSPACE/dist/blob-emoji" "node_modules/@0230am/blob-emoji" "$GITHUB_WORKSPACE/dist/npm/blob-emoji.tgz"
